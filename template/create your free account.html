<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Free Account - TaskFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #ffffff);
        }

        .account-section {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 15px;
        }

        .account-card {
            width: 100%;
            max-width: 520px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .account-icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 50%;
            color: #4f46e5;
            background: #e0e7ff;
            font-size: 35px;
        }

        .form-control {
            padding: 12px;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">
            Task<span>Flow</span>
        </div>

        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('features') }}">Features</a></li>
            <li><a href="{{ url_for('how_it_works') }}">How It Works</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
            <li>
                <a href="{{ url_for('register') }}" class="nav-button">Register</a>
            </li>
        </ul>
    </nav>
</header>

<section class="account-section">
    <div class="account-card">

        <div class="account-icon">
            <i class="bi bi-person-plus"></i>
        </div>

        <h1 class="text-center fw-bold">Create Your Free Account</h1>

        <p class="text-center text-muted mb-4">
            Start organizing your tasks and reminders today.
        </p>

        <form method="POST" action="{{ url_for('register') }}">

            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">
                    Full Name
                </label>

                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    Email Address
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Create a password"
                       minlength="6"
                       required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold">
                    Confirm Password
                </label>

                <input type="password"
                       class="form-control"
                       id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm your password"
                       minlength="6"
                       required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="checkbox"
                       id="terms"
                       required>

                <label class="form-check-label" for="terms">
                    I agree to the Terms and Conditions.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-person-check"></i>
                Create Free Account
            </button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
